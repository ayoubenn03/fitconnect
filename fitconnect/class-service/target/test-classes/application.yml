# Configuration de test : pas de dependance a un config-server ou eureka-server reels.
spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:classdb-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
