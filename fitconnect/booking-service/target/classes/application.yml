# Valeurs de secours si le config-server est indisponible ; config-repo/booking-service.yml
# (routes Feign timeouts, resilience4j, cron scheduler) prend le dessus une fois joignable.
spring:
  application:
    name: booking-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html
